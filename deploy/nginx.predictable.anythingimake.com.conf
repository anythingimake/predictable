# predictable.anythingimake.com — fan tracker for the Predictable show
# React SPA at / + Express API at /api (proxied to localhost:3801)

server {
    listen 80;
    listen [::]:80;
    server_name predictable.anythingimake.com;
    return 301 https://predictable.anythingimake.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name predictable.anythingimake.com;

    ssl_certificate     /etc/ssl/anythingimake.pem;
    ssl_certificate_key /etc/ssl/anythingimake.key;
    server_tokens off;

    root /var/www/predictable;
    index index.html;

    # Security headers — applied to every response from this server block.
    # HSTS is set by Cloudflare; X-Frame-Options blocks clickjacking, nosniff
    # stops MIME-type guessing, Referrer-Policy keeps referrers short.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip JSON / text responses from the API proxy too (Cloudflare already does
    # this at the edge, but local curl + cache misses benefit from origin compression).
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # API → Node service on :3801
    location /api/ {
        proxy_pass http://127.0.0.1:3801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: serve static, fall back to index.html for client routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets (Vite emits content-hashed filenames)
    location ~* /assets/.*\.(css|js|woff2?|png|jpe?g|gif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # `add_header` in a nested block REPLACES the parent's headers, so re-emit
        # the security headers here to keep them on hashed asset responses.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # No-cache for entry HTML
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
