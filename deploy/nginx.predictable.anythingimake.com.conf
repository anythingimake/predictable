# predictable.anythingimake.com — fan tracker for the Predictable show
# React SPA at / + Express API at /api (proxied to localhost:3801)

server {
    listen 80;
    listen [::]:80;
    server_name predictable.anythingimake.com;
    return 301 https://predictable.anythingimake.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name predictable.anythingimake.com;

    ssl_certificate     /etc/ssl/anythingimake.pem;
    ssl_certificate_key /etc/ssl/anythingimake.key;
    server_tokens off;

    root /var/www/predictable;
    index index.html;

    # Security headers — applied to every response from this server block.
    # HSTS is set by Cloudflare; X-Frame-Options blocks clickjacking, nosniff
    # stops MIME-type guessing, Referrer-Policy keeps referrers short.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip JSON / text responses from the API proxy too (Cloudflare already does
    # this at the edge, but local curl + cache misses benefit from origin compression).
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Admin API — auth'd reads + mutations. No proxy_cache here => never cached.
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health — true liveness probe, never serve a cached "ok".
    location = /api/health {
        proxy_pass http://127.0.0.1:3801;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public read-only API → Node service on :3801. Microcache GET/HEAD for 60s so
    # the single Node process is hit ~once per endpoint per minute under load.
    location /api/ {
        proxy_pass http://127.0.0.1:3801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        proxy_cache predictable_api;
        proxy_cache_methods GET HEAD;                # POST/PUT/DELETE bypass automatically
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;  # sessionless read-only API
        proxy_cache_lock on;                         # collapse concurrent misses -> 1 origin hit
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;            # serve stale, refresh in background
        add_header X-Cache-Status $upstream_cache_status always;

        # Pre-wire edge/browser caching so a future Cloudflare cache rule works.
        add_header Cache-Control "public, max-age=30, s-maxage=60, stale-while-revalidate=60" always;

        # add_header in a nested block REPLACES inherited ones — re-emit security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: serve static, fall back to index.html for client routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets (Vite emits content-hashed filenames)
    location ~* /assets/.*\.(css|js|woff2?|png|jpe?g|gif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # `add_header` in a nested block REPLACES the parent's headers, so re-emit
        # the security headers here to keep them on hashed asset responses.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # No-cache for entry HTML
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
