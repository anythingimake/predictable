# Origin microcache for the Predictable API (/api/*). http{} context — deploy to
# /etc/nginx/conf.d/predictable-cache.conf. The API data only changes hourly, so a
# 60s cache (see the /api/ location block) caps origin (Node + SQLite) load to
# ~1 request per endpoint per minute regardless of traffic.
# ~10MB key zone + 200MB on-disk cap (plenty of headroom; root fs has ~9.6GB free).
proxy_cache_path /var/cache/nginx/predictable
    levels=1:2 keys_zone=predictable_api:10m max_size=200m inactive=10m use_temp_path=off;
